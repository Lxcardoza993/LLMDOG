[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdog"
version = "1.0.0"
description = "LLM-powered local-service watchdog with self-healing and bug learning"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lxcardoza"}]
requires-python = ">=3.8"
dependencies = ["pyyaml>=6.0.3"]
keywords = ["watchdog", "self-healing", "llm", "monitoring", "systemd", "observability", "homelab"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Intended Audience :: System Administrators",
]

[project.scripts]
llmdog = "llmdog:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[tool.setuptools]
py-modules = ["llmdog"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 看门狗脚本允许紧凑单行风格(单行 if/分号);模块级 import 位置灵活(先加载 config.env)
ignore = ["E701", "E702", "E402", "E741"]

[tool.pytest.ini_options]
addopts = "-ra --cov=llmdog --cov-report=term-missing"
testpaths = ["tests"]
